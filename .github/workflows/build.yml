name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build both apps
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Noti-viewer-apk
          path: noti/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notic-camera-apk
          path: notic/build/outputs/apk/debug/*.apk
